<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Norte MT Marketing Hub</title>
  <style>
    body{font-family:Arial,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:32px}
    .wrap{max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
    .card{background:#111827;padding:20px;border-radius:14px;border:1px solid #334155}.num{font-size:34px;font-weight:700}
    h1{margin-top:0}.tag{display:inline-block;padding:6px 10px;background:#1e293b;border-radius:999px;margin-right:8px}
  </style>
</head>
<body>
<div class="wrap">
  <h1>🚀 Norte MT Marketing Hub</h1>
  <p>CRM + campanhas + métricas + automação de divulgação.</p>
  <div class="grid">
    <div class="card"><div class="num">{{ contacts }}</div><div>Contatos</div></div>
    <div class="card"><div class="num">{{ campaigns }}</div><div>Campanhas</div></div>
    <div class="card"><div class="num">{{ sends }}</div><div>Envios registrados</div></div>
  </div>
  <div class="card" style="margin-top:16px">
    <b>Próximos módulos</b><br><br>
    <span class="tag">Instagram/Facebook</span>
    <span class="tag">WhatsApp Business</span>
    <span class="tag">Follow-up</span>
    <span class="tag">Landing pages</span>
    <span class="tag">IA para conteúdo</span>
  </div>
</div>
</body>
</html>
