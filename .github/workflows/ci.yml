name: CI - Marketing Hub V0.3

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Testes Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONPATH: backend
      DATABASE_URL: sqlite:///./ci_test.db
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: "ci@nortemtsistemas.local"
      IMAP_HOST: ""
      IMAP_PORT: "993"
      IMAP_USER: ""
      IMAP_PASSWORD: ""
      IMAP_MAILBOX: "INBOX"

    steps:
      - name: 1 - Checkout do código
        uses: actions/checkout@v4

      - name: 2 - Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 3 - Mostrar ambiente
        run: |
          python --version
          python -m pip --version
          pwd
          ls -la
          ls -la backend

      - name: 4 - Instalar dependências
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest httpx

      - name: 5 - Validar sintaxe
        run: |
          set -euxo pipefail
          python -m compileall -q backend/app

      - name: 6 - Testar import da aplicação
        working-directory: backend
        run: |
          set -euxo pipefail
          python -c "from app.main import app; print('FastAPI:', app.title, app.version)"

      - name: 7 - Rodar smoke tests
        working-directory: backend
        run: |
          set -euxo pipefail
          pytest tests/test_smoke.py -vv --maxfail=1 --tb=short

      - name: 8 - Resultado final
        if: success()
        run: echo "✅ Marketing Hub V0.3 passou nos testes automáticos"
