name: CI - Marketing Hub V0.3

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Testes Python 3.13
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///./ci_test.db
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: "ci@nortemtsistemas.local"
      IMAP_HOST: ""
      IMAP_PORT: "993"
      IMAP_USER: ""
      IMAP_PASSWORD: ""
      IMAP_MAILBOX: "INBOX"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Validar sintaxe e imports
        run: python -m compileall -q backend/app

      - name: Rodar smoke tests
        working-directory: backend
        run: pytest -q
